[project]
site_url = "https://jgalabs.dk/computerome-zensical/"
repo_url = "https://github.com/jakob1379/computerome-zensical"
repo_name = "jakob1379/computerome-zensical"
edit_uri = "edit/main/docs/"
site_name = "Computerome Wiki"
site_description = "User documentation for Computerome, the Danish national supercomputer for life sciences: HPC, Cloud, storage, software and job scheduling."
site_author = "Computerome"
copyright = "Content &copy; Computerome &middot; Ported from <a href=\"https://computerome.dk/wiki\">computerome.dk/wiki</a>"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = [
    "getting-started/index.md",
    "getting-started/first-time-login.md",
    "two-factor-authentication-2fa.md",
    "getting-started/ip-restrictions.md",
    "getting-started/roles-and-responsibilities.md",
  ] },
  { "Projects" = [
    "managing-projects/index.md",
    "managing-projects/cloud-projects.md",
    "managing-projects/hpc-projects.md",
  ] },
  { "Compute" = [
    "compute/index.md",
    "compute/cloud-compute.md",
    "compute/hpc-compute.md",
  ] },
  { "Storage" = [
    "storage/index.md",
    "storage/cloud-storage.md",
    "storage/hpc-storage.md",
  ] },
  { "Software" = [
    "software/index.md",
    "software/cloud-software.md",
    "software/hpc-software.md",
    "software/module-environment-guide.md",
  ] },
  { "Running Jobs" = [
    "running-jobs/index.md",
    "running-jobs/slurm.md",
    "running-jobs/slurm-array-jobs.md",
    "running-jobs/hpc-queueing-system-moab-torque.md",
    "running-jobs/open-on-demand.md",
  ] },
  { "Reference" = [
    "cloud-servers-with-data-providers.md",
    "high-performance-computing-hpc.md",
    "tags.md",
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
variant = "classic"
custom_dir = "overrides"
logo = "assets/computerome-logo.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.tags]

[project.plugins.glightbox]

[project.plugins.minify]
minify_html = true
minify_js = true
minify_css = true
minify_inline_js = true
minify_inline_css = true
cache_safe = true
css_files = ["stylesheets/extra.css"]
htmlmin_opts.remove_comments = true
htmlmin_opts.reduce_boolean_attributes = true

[project.plugins.optimize]

[project.plugins.privacy]
assets_exclude = [
  "delphiapp.computerome.dk/*",
  "unpkg.com/ace-builds*",
  "unpkg.com/pyodide*",
  "cdn.jsdelivr.net/pyodide/*",
  "imasdk.googleapis.com/*",
  "pagead2.googlesyndication.com/*",
  "s0.2mdn.net/*",
  "player.vimeo.com/*",
]

[project.plugins.redirects.redirect_maps]
"user-guide.md" = "getting-started/index.md"

[project.plugins.llmstxt]
markdown_description = "User documentation for Computerome HPC and Cloud: accounts, 2FA, projects, compute, storage, software modules and job scheduling (SLURM, Moab/Torque)."
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Getting started" = ["getting-started/*.md", "two-factor-authentication-2fa.md"]
"Projects" = ["managing-projects/*.md"]
"Compute" = ["compute/*.md"]
"Storage" = ["storage/*.md"]
"Software" = ["software/*.md"]
"Running jobs" = ["running-jobs/*.md"]
"Reference" = ["cloud-servers-with-data-providers.md", "high-performance-computing-hpc.md"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
