name: Sync upstream wiki
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: sync-upstream
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: sudo apt-get update && sudo apt-get install -y pngquant
      - run: pip install uv
      - run: uv sync --frozen
      - id: sync
        run: |
          uv run --frozen computerome-zensical | tee "$RUNNER_TEMP/sync.txt"
          if grep -qE '^(new|conflict) ' "$RUNNER_TEMP/sync.txt"; then echo agent=true >> "$GITHUB_OUTPUT"; fi
      - if: steps.sync.outputs.agent == 'true' && env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(uv run --frozen zensical build:*),Bash(git diff:*)"
          prompt: |
            The weekly sync pulled the Computerome wiki from its Strapi CMS into this Zensical site.
            Its report is in ${{ runner.temp }}/sync.txt, one `<status> <path>` per line; paths are relative to docs/.

            docs/ is hand-edited and is the source of truth. upstream/ holds the machine-converted
            upstream pages used as the merge base: never edit anything in upstream/.

            - `conflict <path>`: docs/<path> contains diff3 conflict markers (`<<<<<<< docs`,
              `||||||| previous-upstream`, `=======`, `>>>>>>> upstream`). The change upstream made is the
              difference between the previous-upstream and upstream sections. Apply that change to the docs
              section, keeping the local page's style (frontmatter, admonitions, content tabs, icons, link
              style), and remove every marker.
            - `new <path>`: a page converted by code only. Restyle it to match its sibling pages (frontmatter
              incl. `icon`, admonitions, headings, tabs where siblings use them) and add it to `nav` in
              zensical.toml under the section its path belongs to.
            - Ignore `merged`, `baseline` and `removed` lines; a human reviews those.

            Finish by running `uv run --frozen zensical build --clean --strict` and fix any warning you caused.
            Do not commit, push or open a PR; a later step does that.
      - id: build
        continue-on-error: true
        run: |
          uv run --frozen zensical build --clean --strict
          ! grep -rlE '^(<<<<<<<|>>>>>>>) ' docs
      - run: |
          {
            echo "Weekly sync from <https://computerome.dk/wiki> (Strapi CMS)."
            echo
            if [ "${{ steps.build.outcome }}" = failure ]; then
              echo "> [!WARNING]"
              echo "> Strict build failed or conflict markers remain in docs/. See the workflow run."
              echo
            fi
            echo "| Status | Page |"
            echo "| --- | --- |"
            grep -E '^[a-z]+ ' "$RUNNER_TEMP/sync.txt" | sed -E 's/^([a-z]+) (.*)$/| \1 | `\2` |/'
            echo
            echo "\`merged\`: upstream change applied cleanly. \`conflict\`/\`new\`: formatted by Claude when the token is set."
            echo "\`removed\`: page deleted upstream, its snapshot is dropped; delete the \`docs/\` page and its nav entry by hand if wanted."
          } > "$RUNNER_TEMP/pr.md"
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: upstream-sync
          delete-branch: true
          commit-message: "docs: sync from computerome.dk wiki"
          title: "docs: sync from computerome.dk wiki"
          body-path: ${{ runner.temp }}/pr.md
          draft: ${{ steps.build.outcome == 'failure' }}
          add-paths: |
            docs
            upstream
            zensical.toml
