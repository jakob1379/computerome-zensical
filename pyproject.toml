[project]
name = "computerome-zensical"
version = "0.1.0"
description = "The Computerome wiki as a Zensical site, synced from the Strapi CMS"
readme = "README.md"
authors = [
    { name = "Jakob Stender Guldberg", email = "jakob1379@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "stamina>=26.2.0",
    "zensical>=0.1.1",
]

[project.scripts]
computerome-zensical = "computerome_zensical:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
